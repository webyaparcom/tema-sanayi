<style>
  /* sayac-nokta-matris — Oranı sayılabilir noktalarla gösterir (waffle chart); bilgi grafiği dili, «100 kişiden 98'i» okuması. */
  .modulex-sayac-nokta-matris { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-nokta-matris *, .modulex-sayac-nokta-matris *::before, .modulex-sayac-nokta-matris *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-nokta-matris :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-nokta-matris :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-nokta-matris :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-nokta-matris :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-nokta-matris img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-nokta-matris) img { height: auto; }
  .modulex-sayac-nokta-matris [hidden] { display: none !important; }
  .modulex-sayac-nokta-matris :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-nokta-matris :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-nokta-matris-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-nokta-matris-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-nokta-matris--bassiz .modulex-sayac-nokta-matris-bas { display: none; }
  .modulex-sayac-nokta-matris-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-nokta-matris-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-nokta-matris-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-nokta-matris-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-sayac-nokta-matris-ust { grid-column: 1 / -1; }
  .modulex-sayac-nokta-matris-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-nokta-matris-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-nokta-matris-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-nokta-matris-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-nokta-matris-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-nokta-matris-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-nokta-matris-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 28px; }
  .modulex-sayac-nokta-matris-oge { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: center; gap: 22px; padding: 20px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; transition: border-color 0.3s ease; }
  .modulex-sayac-nokta-matris-oge:hover { border-color: --accent--; }
  .modulex-sayac-nokta-matris-matris { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: 132px; }
  .modulex-sayac-nokta-matris-n { display: block; aspect-ratio: 1; border-radius: 50%; background: --cizgi--; }
  .modulex-sayac-nokta-matris-n--dolu { background: --accent--; transition: background 0.2s ease, transform 0.3s ease; transition-delay: calc(var(--j) * 8ms); }
  .modulex-sayac-nokta-matris--hazir:not(.modulex-sayac-nokta-matris--gor) .modulex-sayac-nokta-matris-n--dolu { background: --cizgi--; transform: scale(0.4); }
  .modulex-sayac-nokta-matris-yazi { display: grid; gap: 4px; }
  .modulex-sayac-nokta-matris-sayi { font-size: clamp(2rem, 3.4vw, 2.6rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-nokta-matris-ek { color: --accentInk--; font-size: 0.55em; }
  .modulex-sayac-nokta-matris-etiket { font-size: 1rem; font-weight: 700; }
  .modulex-sayac-nokta-matris-not { color: --muted--; font-size: 0.88rem; }
  @media (max-width: 768px) {
    .modulex-sayac-nokta-matris-oge { grid-template-columns: 104px minmax(0, 1fr); gap: 14px; padding: 14px; }
    .modulex-sayac-nokta-matris-matris { width: 104px; gap: 2px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-nokta-matris :is(.modulex-sayac-nokta-matris-baslik, .modulex-sayac-nokta-matris-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-nokta-matris-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-sayac-nokta-matris-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-sayac-nokta-matris { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-nokta-matris *, .modulex-sayac-nokta-matris *::before, .modulex-sayac-nokta-matris *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-nokta-matris";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
