<section class="modulex-tt" id="modulex-tt-{{id}}" aria-labelledby="modulex-tt-{{id}}-h">
  <div class="modulex-tt-wrap">
    <div class="modulex-tt-head">
      <h2 class="modulex-tt-h2" id="modulex-tt-{{id}}-h">{{title}}</h2>
      <div class="modulex-tt-tools">{{ttTools}}</div>
    </div>
    <p class="modulex-tt-hint">{{ttHint}}</p>
    {{ttTable}}
    <p class="modulex-tt-status" role="status" aria-live="polite" data-tt-status></p>
    <div class="modulex-tt-down">{{ttDownloads}}</div>
    <script type="application/json" id="modulex-tt-{{id}}-cfg">{{ttCfg}}</script>
  </div>
</section>

<style>
  .modulex-tt { box-sizing: border-box; width: 100%; padding-block: 40px; background: --bgcolor--; color: --textcolor--; font-size: 16px; line-height: 1.5; }
  .modulex-tt *, .modulex-tt *::before, .modulex-tt *::after { box-sizing: border-box; }
  .modulex-tt :where(*) { font-size: inherit; font-weight: inherit; line-height: inherit; }
  .modulex-tt .material-symbols-outlined { font-size: 20px; line-height: 1; font-weight: 400; }
  .modulex-tt-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .modulex-tt-wrap { max-width: --max--; margin-inline: auto; padding-inline: 20px; }
  .modulex-tt-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-block-end: 8px; }
  .modulex-tt-h2 { margin: 0; font-size: 1.6rem; font-weight: 800; }
  .modulex-tt-tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-tt-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 44px; min-height: 44px; padding-inline: 16px; background: --surface--; color: --textcolor--;
    border: 1px solid --bordercolor--; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .modulex-tt-btn:hover { background: --surface2--; border-color: --accent--; }
  .modulex-tt :focus-visible { outline: 2px solid --accent--; outline-offset: 2px; }
  .modulex-tt-hint { margin: 0 0 12px; color: --mutedcolor--; font-size: 0.9rem; }
  .modulex-tt-hint:empty { display: none; }
  .modulex-tt-scroll { overflow-x: auto; border: 1px solid --bordercolor--; border-radius: 14px; background: --bgcolor--; -webkit-overflow-scrolling: touch; }
  .modulex-tt-table { width: 100%; min-width: 640px; border-collapse: separate; border-spacing: 0; }
  .modulex-tt-table th, .modulex-tt-table td { padding: 12px 16px; text-align: start; border-block-end: 1px solid --bordercolor--; white-space: nowrap; }
  .modulex-tt-table thead th { background: --surface2--; font-weight: 700; position: sticky; inset-block-start: 0; }
  .modulex-tt-table tbody th { font-weight: 700; background: --bgcolor--; }
  .modulex-tt-table tbody tr:nth-child(even) td, .modulex-tt-table tbody tr:nth-child(even) th { background: --surface--; }
  .modulex-tt-table tbody tr { transition: background-color 0.25s ease; }
  .modulex-tt-table tbody tr:hover td, .modulex-tt-table tbody tr:hover th { background: color-mix(in srgb, --accent-- 10%, --bgcolor--); }
  .modulex-tt-table tbody tr:last-child th, .modulex-tt-table tbody tr:last-child td { border-block-end: 0; }
  .modulex-tt-table .modulex-tt-num { text-align: end; }
  /* yapışkan ilk sütun: mantıksal inset (RTL'de sağa yapışır) */
  .modulex-tt-sticky thead th:first-child, .modulex-tt-sticky tbody th { position: sticky; inset-inline-start: 0; z-index: 1; border-inline-end: 1px solid --bordercolor--; }
  .modulex-tt-sticky thead th:first-child { z-index: 2; }
  .modulex-tt-sort { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: -12px -8px; padding: 12px 8px; border: 0; background: transparent; color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
  .modulex-tt-sort:hover { color: --accent--; }
  .modulex-tt-ic { opacity: 0.55; transition: opacity 0.2s ease; }
  th[aria-sort="ascending"] .modulex-tt-ic, th[aria-sort="descending"] .modulex-tt-ic { opacity: 1; color: --accent--; }
  .modulex-tt-status { min-height: 1.5em; margin: 8px 0 0; color: --mutedcolor--; font-size: 0.9rem; }
  .modulex-tt-empty { padding: 24px; text-align: center; color: --mutedcolor--; border: 1px dashed --bordercolor--; border-radius: 14px; }
  .modulex-tt-h3 { margin: 24px 0 10px; font-size: 1.1rem; font-weight: 700; }
  .modulex-tt-dls { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .modulex-tt .modulex-tt-dl:link, .modulex-tt .modulex-tt-dl:visited, .modulex-tt .modulex-tt-dl:hover, .modulex-tt .modulex-tt-dl:active { color: --textcolor--; }
  .modulex-tt-dl { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 16px; background: --surface--; border: 1px solid --bordercolor--; border-radius: 12px; text-decoration: none; transition: border-color 0.25s ease, transform 0.25s ease; }
  .modulex-tt-dl:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-tt-dl .material-symbols-outlined { font-size: 26px; color: --accent--; }
  .modulex-tt-dln { font-weight: 600; }
  .modulex-tt-dlt { padding: 2px 8px; border-radius: 6px; background: --surface2--; font-size: 0.75rem; font-weight: 700; }
  @media (max-width: 768px) {
    .modulex-tt { padding-block: 28px; }
    .modulex-tt-wrap { padding-inline: 12px; }
    .modulex-tt-h2 { font-size: 1.3rem; }
    .modulex-tt-tools { width: 100%; }
    .modulex-tt-btn { flex: 1; }
    .modulex-tt-table th, .modulex-tt-table td { padding: 10px 12px; }
    .modulex-tt-dls { flex-direction: column; }
    .modulex-tt-dl { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-tt *, .modulex-tt *::before, .modulex-tt *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    .modulex-tt { padding: 0; background: #fff; color: #000; }
    .modulex-tt-tools, .modulex-tt-hint, .modulex-tt-down, .modulex-tt-status { display: none; }
    .modulex-tt-scroll { overflow: visible; border: 0; }
    .modulex-tt-table { min-width: 0; }
    .modulex-tt-table th, .modulex-tt-table td { white-space: normal; border-color: #000; background: #fff; position: static; }
  }
</style>

<script>
(function () {
  var kok = document.getElementById("modulex-tt-{{id}}");
  var cfgEl = document.getElementById("modulex-tt-{{id}}-cfg");
  if (!kok || !cfgEl) { return; }
  var cfg = {};
  try { cfg = JSON.parse(cfgEl.textContent); } catch (e) { cfg = {}; }
  var tablo = kok.querySelector("[data-tt-table]");
  var durum = kok.querySelector("[data-tt-status]");
  if (!tablo) { return; }
  var govde = tablo.tBodies[0];

  function bildir(m) { if (durum) { durum.textContent = m; } }

  /* ---- sıralama (yalnız sortable=true ise başlıklarda düğme vardır) ---- */
  var sonSutun = -1;
  var yon = 1;
  function sirala(ci) {
    var th = tablo.querySelector('th[data-tt-col="' + ci + '"]');
    var sayisal = th.getAttribute("data-tt-type") === "num";
    yon = sonSutun === ci ? -yon : 1;
    sonSutun = ci;
    var satirlar = [];
    for (var i = 0; i < govde.rows.length; i++) { satirlar.push({ tr: govde.rows[i], i: i }); }
    var col = new Intl.Collator(cfg.lang || undefined, { numeric: true, sensitivity: "base" });
    satirlar.sort(function (a, b) {
      var x = a.tr.cells[ci].getAttribute("data-v");
      var y = b.tr.cells[ci].getAttribute("data-v");
      var c;
      if (sayisal) {
        var nx = parseFloat(x);
        var ny = parseFloat(y);
        c = (isNaN(nx) ? Infinity : nx) - (isNaN(ny) ? Infinity : ny);
        if (!isFinite(c)) { c = isNaN(nx) && isNaN(ny) ? 0 : isNaN(nx) ? 1 : -1; }
      } else {
        c = col.compare(x, y);
      }
      return c !== 0 ? c * yon : a.i - b.i;
    });
    for (var k = 0; k < satirlar.length; k++) { govde.appendChild(satirlar[k].tr); }
    var ths = tablo.querySelectorAll("th[data-tt-col]");
    for (var t = 0; t < ths.length; t++) {
      var aktif = ths[t] === th;
      ths[t].setAttribute("aria-sort", aktif ? (yon === 1 ? "ascending" : "descending") : "none");
      var ic = ths[t].querySelector(".material-symbols-outlined");
      if (ic) { ic.textContent = aktif ? (yon === 1 ? "arrow_upward" : "arrow_downward") : "unfold_more"; }
    }
    var ad = th.textContent.replace(/(unfold_more|arrow_upward|arrow_downward)/g, "").trim();
    bildir((yon === 1 ? cfg.asc : cfg.desc).replace("{col}", ad));
  }

  /* ---- TSV kopyalama: görünen sıra, ham değerler (Excel'de ondalık ayraç karışmaz) ---- */
  function tsv() {
    var satir = [];
    var bas = [];
    var ths = tablo.querySelectorAll("th[data-tt-col]");
    for (var h = 0; h < ths.length; h++) { bas.push(ths[h].textContent.replace(/(unfold_more|arrow_upward|arrow_downward)/g, "").replace(/\s+/g, " ").trim()); }
    satir.push(bas.join("\t"));
    for (var r = 0; r < govde.rows.length; r++) {
      var h2 = [];
      for (var c = 0; c < govde.rows[r].cells.length; c++) { h2.push((govde.rows[r].cells[c].getAttribute("data-v") || "").replace(/[\t\r\n]+/g, " ")); }
      satir.push(h2.join("\t"));
    }
    return satir.join("\n");
  }
  function yedekKopya(metin) {
    var ta = document.createElement("textarea");
    ta.value = metin;
    ta.setAttribute("readonly", "");
    ta.className = "modulex-tt-vh";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function kopyala() {
    var m = tsv();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(m).then(function () { bildir(cfg.copied); }, function () { bildir(yedekKopya(m) ? cfg.copied : cfg.fail); });
    } else {
      bildir(yedekKopya(m) ? cfg.copied : cfg.fail);
    }
  }

  kok.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("button") : null;
    if (!el || !kok.contains(el)) { return; }
    if (el.hasAttribute("data-tt-sort")) { sirala(Number(el.getAttribute("data-tt-sort"))); }
    else if (el.hasAttribute("data-tt-copy")) { kopyala(); }
    else if (el.hasAttribute("data-tt-print")) { window.print(); }
  });
})();
</script>
