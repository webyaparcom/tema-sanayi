  <style>
    .moduleimg {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .moduleimg > img {
      width: 100%;
      max-width: --imgwidth--;
    }
  
    .footer {
      position: relative;
      background: --bgcolor--;
      padding: 20px 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin-top: 120px;
    }
  
    .social-icon,

    }
  
    .social-icon__item,
    .menu__item {
      list-style: none;
    }
  
    .social-icon__link {
      font-size: 2rem;
      color: --color--;
      margin: 0 10px;
      display: inline-block;
      transition: transform 0.5s;
    }
  
    .social-icon__link:hover {
      transform: translateY(-10px);
    } 
  
    .menu__link {
      font-size: 1.2rem;
      color: --color-- !important;
      margin: 0 10px;
      display: inline-block;
      transition: opacity 0.5s;
      text-decoration: none;
      opacity: 0.75;
      font-weight: 300;
    }
  
    .menu__link:hover {

      font-weight: 300;

      background-size: 1000px 102px;

    .wave#wave1 {

      opacity: 1;
      bottom: 0;
      background-position-x: 0;
    }
  
    .wave#wave2 {
      z-index: 99;
      opacity: 0.5;
      bottom: 10px;
      background-position-x: 250px;
    }
  
    .wave#wave3 {
      z-index: 100;
      opacity: 0.2;
      bottom: 15px;
      background-position-x: 500px;
    }
  
    .wave#wave4 {
      z-index: 99;

    }
  
  
  /* W2 — animasyon, mobil, erisilebilirlik */
  @keyframes modulexW2Enter {
    from { opacity: 0.98; }
    to { opacity: 1; }
  }

  [class*="modulex"] {
    box-sizing: border-box;
    animation: modulexW2Enter 0.3s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
